<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Inscription</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="./style.css">
    <script src="https://unpkg.com/ionicons@5.4.0/dist/ionicons.js"></script>
  <style>
    .inscription-container{
        display: flex;
        flex-direction: column;
        gap: 40px;
        max-width: 600px;
        margin: 50px auto;
        padding: 0 20px;
    }

    .box-inscription{
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: linear-gradient(135deg, rgba(121, 3, 32, 0.95), rgba(90, 2, 24, 0.95));
        border-radius: 14px;
        padding: 20px 24px;
        color: white;
        font-size: 16px;
        font-weight: 500;
        cursor: pointer;
        box-shadow: 0 4px 12px rgba(121, 3, 32, 0.2);
        transition: transform 0.2s ease, box-shadow 0.2s ease;
        text-decoration: none;
    }

    .box-inscription:hover{
        transform: translateY(-2px);
        box-shadow: 0 6px 16px rgba(121, 3, 32, 0.3);
    }

    .box-inscription .box-label{
        display: flex;
        align-items: center;
        gap: 12px;
    }

    .box-inscription ion-icon{
        font-size: 18px;
        transition: transform 0.2s ease;
    }

    .box-inscription:hover ion-icon{
        transform: translateX(-3px);
    }

    .box-inscription ion-icon.leading{
        font-size: 20px;
        transform: none;
    }

    .box-inscription:hover ion-icon.leading{
        transform: none;
    }
  </style>
</head>
<body>
   <special-header></special-header>
   <div id="overlay" onclick=hideSidebar() aria-hidden="true"></div>
   <br>
   <div class="inscription-container">
        <div class="box-inscription" onclick="window.open('https://www.zeffy.com/en-CA/ticketing/inscription-2026-2027-255e-groupe-scout-sainte-rafqa', '_blank')">
            <p>Nouvelles Inscriptions</p>
            <ion-icon name="arrow-forward-outline"></ion-icon>
        </div>
        <div class="box-inscription" onclick="window.open('https://www.zeffy.com/en-CA/ticketing/reinscription-2026-2027-255e-groupe-scout-sainte-rafqa','_blank')">
            <p>Réinscriptions</p>
            <ion-icon name="arrow-forward-outline"></ion-icon>
        </div>
   </div>
   

   <br>
    <special-footer></special-footer>

    <script src="./script.js"></script>
</body>
</html>
